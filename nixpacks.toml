# Without this file, Nixpacks auto-detects this repo as a Node.js project
# (because package.json exists at the root for Vercel's frontend build) and
# skips Python entirely — meaning `pip install -r requirements.txt` never
# runs, and gunicorn is never installed. That's the root cause of every
# "gunicorn: command not found" crash. This file forces the Python
# provider for Railway; Vercel is unaffected since it doesn't read this file.

providers = ["python"]

[phases.setup]
# System libraries geopandas/fiona/shapely need to build against.
nixPkgs = ["python311", "gcc", "gdal", "geos", "proj"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt"
]
