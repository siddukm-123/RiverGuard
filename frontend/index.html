<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RiverGuard — Monitoring Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="dot"></span> RIVERGUARD</div>
  <div class="nav-links">
    <a href="/details">Details</a>
    <a href="/" class="active">Dashboard</a>
    <a href="/detect">Manual Detection</a>
  </div>
</div>

<div id="status-banner" class="status-banner" style="display:none;"></div>

<div class="layout">
  <div>
    <div class="metric-row" id="metric-row">
      <div class="metric-card"><div class="label">Rivers added</div><div class="value" id="m-rivers">—</div></div>
      <div class="metric-card high"><div class="label">High severity</div><div class="value" id="m-high">—</div></div>
      <div class="metric-card watch"><div class="label">Watch</div><div class="value" id="m-watch">—</div></div>
      <div class="metric-card" title="Rivers that have had at least one completed satellite scan"><div class="label">Rivers scanned</div><div class="value" id="m-scanned">—</div></div>
    </div>

    <div class="panel" style="margin-bottom: 18px;">
      <div class="panel-header"><h2>Add a river to monitor</h2></div>
      <div style="padding: 16px 18px;">
        <div class="search-row">
          <input type="text" id="river-search-input" class="search-input" placeholder="Search a river, e.g. 'Tungabhadra river Davangere'">
          <button class="btn primary" id="river-search-btn">Search</button>
        </div>
        <div id="river-search-results" style="margin-top: 10px;"></div>
      </div>
    </div>

    <div class="panel map-scan" id="map-panel">
      <div class="panel-header">
        <h2>River watch map</h2>
        <div class="map-tools">
          <div class="map-legend">
            <span><span class="lg-box" style="border:2px solid #E4572E;"></span> HIGH alert</span>
            <span><span class="lg-box" style="border:2px dashed #D9A441;"></span> WATCH / low conf</span>
            <span style="color:var(--accent-teal);">live</span>
          </div>
          <button class="btn map-fs-btn" id="map-fs-btn" type="button" aria-pressed="false">⤢ Full screen</button>
        </div>
      </div>
      <div id="map"></div>
    </div>

    <div class="panel" style="margin-top: 18px;">
      <div class="panel-header">
        <h2>Monitored rivers</h2>
        <button class="btn" id="demo-btn" type="button" style="padding:6px 10px; font-size:12px;" title="Adds a clearly-labelled TEST river with a simulated HIGH alert, for demonstrations">＋ Add test river</button>
      </div>
      <div id="rivers-list" style="padding: 4px 0;"></div>
    </div>
  </div>

  <div class="panel feed-panel">
    <div class="panel-header">
      <h2>Alert feed</h2>
    </div>
    <div class="alert-feed" id="alert-feed">
      <div class="empty-state">Loading alerts…</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/env-config.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
